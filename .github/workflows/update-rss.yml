name: Actualizar RSS de GigaGen

on:
  workflow_dispatch:

  schedule:
    - cron: "54 * * * 1-6"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-gigagen
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar horario de Madrid
        id: horario
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Ejecución manual."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HORA=$(TZ=Europe/Madrid date +%H)
          echo "Hora actual en Madrid: $HORA"

          if [ "$HORA" -ge 7 ] && [ "$HORA" -le 22 ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencias
        if: steps.horario.outputs.ejecutar == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir requests==2.32.3 beautifulsoup4==4.12.3 feedgen==1.0.0 python-dateutil==2.9.0.post0

      - name: Crear RSS
        if: steps.horario.outputs.ejecutar == 'true'
        run: |
          python generate_feed.py

          if [ ! -f "docs/feed.xml" ]; then
            echo "ERROR: no se creó docs/feed.xml"
            exit 1
          fi

          ls -lh docs/feed.xml

      - name: Guardar RSS
        if: steps.horario.outputs.ejecutar == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/feed.xml

          if git diff --cached --quiet; then
            echo "La RSS no contiene cambios."
            exit 0
          fi

          git commit -m "Actualizar RSS de GigaGen"
          git pull --rebase origin main
          git push origin main
