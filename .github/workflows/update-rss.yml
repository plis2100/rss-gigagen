name: Actualizar RSS de GigaGen

on:
  workflow_dispatch:

  schedule:
    # GitHub usa UTC. Se ejecuta cada hora de lunes a sábado
    # y después se comprueba el horario real de Madrid.
    - cron: "0 * * * 1-6"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-gigagen
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar horario
        id: horario
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ejecutar=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIA=$(TZ=Europe/Madrid date +%u)
          HORA=$(TZ=Europe/Madrid date +%H)

          echo "Día en Madrid: $DIA"
          echo "Hora en Madrid: $HORA"

          if [ "$DIA" -ge 1 ] && [ "$DIA" -le 6 ] &&
             [ "$HORA" -ge 7 ] && [ "$HORA" -le 22 ]; then
            echo "ejecutar=si" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Python
        if: steps.horario.outputs.ejecutar == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.horario.outputs.ejecutar == 'si'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Crear RSS
        if: steps.horario.outputs.ejecutar == 'si'
        run: |
          python generate_feed.py

          test -s docs/feed.xml

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("docs/feed.xml")
          print("docs/feed.xml es un XML válido")
          PY

      - name: Guardar RSS
        if: steps.horario.outputs.ejecutar == 'si'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/feed.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en el RSS."
            exit 0
          fi

          git commit -m "Actualizar RSS de GigaGen"
          git pull --rebase origin main
          git push origin main
